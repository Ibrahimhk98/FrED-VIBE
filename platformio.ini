[platformio]
default_envs = fred_pal_a3

[env:fred_pal_a3]
; Custom A3 wiring: include/board_a3.h, never variant defaults.
; Arduino 2.0.17 / IDF 4.4.7; migrate I2S and ADC together before core 3.x.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = partitions_a3.csv
build_flags =
    -DWEBSOCKETS_TCP_TIMEOUT=250
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 230400
upload_speed = 460800
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.0
    adafruit/RTClib @ 2.1.4
    adafruit/Adafruit BusIO @ 1.17.0
    links2004/WebSockets @ 2.4.2

[env:native]
platform = native@1.2.1
